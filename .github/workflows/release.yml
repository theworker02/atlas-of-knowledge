name: Publish Atlas dataset and GitHub release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        default: "1.1.0"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: huggingface-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_dataset.py
      - run: python atlas_cli.py run --version "${{ inputs.version }}"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_hf_release.py --version "${{ inputs.version }}"
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_DATASET_REPO"
          pip install huggingface_hub
          hf upload "$HF_DATASET_REPO" "dist/huggingface/atlas-of-knowledge-v${{ inputs.version }}" --type dataset --commit-message "Atlas ${{ inputs.version }} complete release"
      - name: Create GitHub release notes and tag
        env:
          GH_TOKEN: ${{ github.token }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          test -n "$HF_DATASET_REPO"
          NOTES="## Dataset release

          The complete validated Atlas v${{ inputs.version }} dataset is published on [Hugging Face](https://huggingface.co/datasets/${HF_DATASET_REPO}).

          This GitHub release intentionally contains no generated dataset files. GitHub hosts the source pipeline; Hugging Face hosts the complete release package, including all splits, subsets, graph export, provenance metadata, schema, dataset card, license, and citation."
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "Atlas of Knowledge v${{ inputs.version }}" \
            --generate-notes \
            --notes "$NOTES"
