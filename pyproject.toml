[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-of-knowledge"
version = "1.0.0"
description = "Policy-gated academic knowledge dataset collector"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}

[project.scripts]
atlas = "atlas_cli:main"
